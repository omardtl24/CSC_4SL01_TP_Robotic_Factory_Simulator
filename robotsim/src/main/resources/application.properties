# Default configuration of the robotsim programs (SimulatorApplication and PersistenceServer).
# Each property can be overridden in the .env file of the module, by an environment variable (e.g.
# PERSISTENCE_PORT for persistence.port) or by a system property (e.g. -Dpersistence.port=9000).

# Persistence server: address used by the clients and port on which the server listens.
persistence.host=localhost
persistence.port=8090
# Directory where the server stores the factory files, relative to the working directory (the module one).
persistence.storage.directory=data

# Simulation microservice (simulation-service module) called by the simulator user interface.
simulation.host=localhost
simulation.port=8080
