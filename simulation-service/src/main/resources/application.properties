# Default configuration of the simulation service.
# Each property can be overridden in the .env file of the module, by an environment variable (e.g. SERVER_PORT
# for server.port) or by a command line argument (e.g. --server.port=9000).

spring.application.name=simulation-service

# Port of the REST methods, called by the simulator user interface (simulation.port of robotsim).
server.port=8080

# Persistence server from which the factory models to simulate are read (persistence.port of robotsim).
persistence.host=localhost
persistence.port=8090

logging.level.fr.tp=INFO
